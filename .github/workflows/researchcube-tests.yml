name: Tests
# Added by ResearchCube Research Run. Runs on every pull request.
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then pip install -e . || true; fi
          pip install pytest
      - name: Run tests
        run: |
          status=0
          pytest -q || status=$?
          if [ "$status" -eq 5 ]; then echo "::warning::No tests were found"; exit 0; fi
          exit $status
